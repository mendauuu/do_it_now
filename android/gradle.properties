org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
# Compile Kotlin inside the Gradle JVM instead of a second daemon JVM —
# saves ~1 GB of RAM, which this machine runs short on during builds.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.enableJetifier=true
android.experimental.enableNewResourceShrinker=true
